# Target companies to monitor.
#
# Fields:
#   name       - display name used in alerts
#   ats        - greenhouse | personio | lever | ashby | teamtailor
#                | smartrecruiters | successfactors | workday
#                | unsupported | unverified
#   identifier - the ATS-specific id, or TODO
#   region     - optional: personio -> de|com, lever -> eu, greenhouse -> eu
#   enabled    - true/false
#
# identifier meaning per ats:
#   greenhouse -> board token in boards.greenhouse.io/<token>
#                 (region: eu if the board is on *.eu.greenhouse.io)
#   personio   -> subdomain before .jobs.personio.de (region: de or com)
#   lever      -> slug in jobs.lever.co/<slug>
#   ashby      -> board name in jobs.ashbyhq.com/<name>
#   teamtailor -> FULL careers-site base URL, e.g. https://careers.acme.com
#                 (Teamtailor tenants use custom domains, so a slug won't do)
#   smartrecruiters -> company id in careers.smartrecruiters.com/<id>
#                 (case-sensitive, e.g. BoschGroup, Continental)
#   successfactors  -> the ?company= value on their apply URL
#                 (e.g. dlrdeutsch); region = the full career host, e.g.
#                 career5.successfactors.eu
#   workday    -> "tenant/wd/site" from the careers URL, e.g.
#                 trumpf/wd3/TRUMPF_Graduates_and_Professionals
#
# SECTIONS, ordered by what you actually DO with each:
#   1. MONITORED       - verified + polled automatically. Nothing to do.
#   2. EMAIL / FORM    - no ATS exists. Apply by email or a form on the
#                        company's own site. Check monthly; these hire rarely
#                        and informally.
#   3. UNSUPPORTED ATS - a real job board, but auth-walled (join.com,
#                        softgarden). >>> CHECK WEEKLY <<<. They post jobs
#                        normally; we just can't poll them. This is your
#                        real blind spot and the top changedetection.io target.
#   4. BIG CORPORATES  - Workday / SuccessFactors / custom. Don't hand-check;
#                        use each company's own job alert instead.
#   5. STILL UNKNOWN   - not yet identified. Open the URL, click a job, hit
#                        Apply, read the domain.
#   6. NO ROUTE FOUND  - no careers page, no ATS, no email. Possibly dormant
#                        or defunct. Delete if you confirm they're gone.
#   7. OUT OF SCOPE    - not German. Kept so you don't re-research them.


