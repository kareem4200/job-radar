name: Job Radar

on:
  schedule:
    # Every 20 minutes, 06:00-22:59 UTC, Monday-Saturday.
    # GitHub Actions cron is best-effort and can be delayed under load -
    # treat this as "roughly every 20 min", not a hard guarantee.
    - cron: "*/20 6-22 * * 1-6"
  workflow_dispatch: {} # lets you trigger a run manually from the Actions tab

permissions:
  contents: write # needed to commit the updated seen-jobs database back

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Poetry
        run: pipx install poetry

      - name: Install dependencies
        run: poetry install --no-interaction --no-root

      - name: Run job radar
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: poetry run python -m job_radar.main

      - name: Commit updated job database
        run: |
          git config user.name "job-radar-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/seen_jobs.sqlite3
          git diff --quiet --cached || git commit -m "Update seen jobs [skip ci]"
          git push
